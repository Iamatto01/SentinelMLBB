<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelMLBB | Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <h1>⚔️ SENTINEL MLBB</h1>
      <p>Track. Analyze. Dominate.</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="squad@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">LOGIN</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
        <div class="form-group">
          <label>In-Game Name (IGN)</label>
          <input type="text" id="reg-name" placeholder="E.g., Oura" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="squad@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Min. 6 characters" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-register">REGISTER</button>
      </form>

      <div id="auth-msg" class="auth-message"></div>
    </div>
  </div>

  <script src="/js/api.js" type="module"></script>
  <script src="/js/auth.js" type="module"></script>
  <script>
    // Tab switching logic
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('auth-msg').style.display = 'none';
    }
  </script>
</body>
</html>
